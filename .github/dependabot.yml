version: 2

# Every ecosystem waits seven days before it proposes a new version: a
# freshly published release is the window in which a compromised maintainer
# account or a hijacked package is still undetected (zizmor
# dependabot-cooldown; Dependabot's own default is three days). The cooldown
# applies to version updates only — security updates are never delayed.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsup"
        update-types: ["version-update:semver-major"]
      # engines.node is >= 22 and .nvmrc pins 22: the type definitions follow
      # the Node line, not the newest major (rule node-pin-parity).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci):"
    # One pull request for every action bump of the week: the tree pins each
    # action to a single SHA (tests/tools/workflows.test.ts), so the bumps are
    # reviewed, and land, together.
    groups:
      actions:
        patterns:
          - "*"

  # The fuzzing engine of .clusterfuzzlite/build.sh (Jazzer.js), pinned by
  # its own lockfile and never a dependency of the package.
  - package-ecosystem: npm
    directory: /.clusterfuzzlite/engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(fuzz):"

  # The ClusterFuzzLite build image, pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(fuzz):"
